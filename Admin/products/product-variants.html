<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Variants - ApnaShop Admin</title>
    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Core Stylesheets -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/tables.css">
    <link rel="stylesheet" href="../assets/css/forms.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    
</head>
<body>
    <div id="app-container" class="dashboard-shell-layout">
        <!-- Sidebar and Header injected dynamically by main.js -->
        <main class="content-wrapper" id="content-container">
            <div class="page-header-section animate-fade-in">
                <div class="header-title-area">
                    <span class="breadcrumbs-label">Product Management / Product Variants</span>
                    <h1 class="page-title-text">Product Variants</h1>
                </div>
                <div class="header-actions-area">
                    <button class="btn btn-primary" id="save-variants">Save Variants</button>
                </div>
            </div>
            
            <div class="page-content-area animate-fade-in">
                
        <div class="card">
            <h3 class="card-title-sub">Configure Options</h3>
            <p class="text-sm text-muted mb-4">Add option types like Size, Color, or Material to generate variants automatically.</p>
            <div class="variants-setup-container" id="variants-setup-rows">
                <div class="variant-option-row">
                    <div class="form-group-item">
                        <label class="form-label-text">Option Name</label>
                        <input type="text" class="form-input-element" value="Size">
                    </div>
                    <div class="form-group-item" style="flex: 2;">
                        <label class="form-label-text">Option Values</label>
                        <input type="text" class="form-input-element" value="S, M, L, XL">
                    </div>
                    <button class="btn btn-icon-only text-danger mt-6"><i class="ri-delete-bin-line"></i></button>
                </div>
            </div>
            <button class="btn btn-secondary-outline mt-4" id="add-variant-option-btn"><i class="ri-add-line"></i> Add Option</button>
        </div>
        
            </div>
        </main>
    </div>
    
    <!-- Core JavaScript -->
    <script src="../assets/js/main.js"></script>
    
</body>
</html>
