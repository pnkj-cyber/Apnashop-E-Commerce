<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Gallery - ApnaShop Admin</title>
    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Core Stylesheets -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/tables.css">
    <link rel="stylesheet" href="../assets/css/forms.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    
</head>
<body>
    <div id="app-container" class="dashboard-shell-layout">
        <!-- Sidebar and Header injected dynamically by main.js -->
        <main class="content-wrapper" id="content-container">
            <div class="page-header-section animate-fade-in">
                <div class="header-title-area">
                    <span class="breadcrumbs-label">Product Management / Product Gallery</span>
                    <h1 class="page-title-text">Product Gallery</h1>
                </div>
                <div class="header-actions-area">
                    <button class="btn btn-primary"><i class="ri-upload-cloud-line"></i> Upload Image</button>
                </div>
            </div>
            
            <div class="page-content-area animate-fade-in">
                
        <div class="card">
            <div class="gallery-drag-drop-area mb-6">
                <i class="ri-image-add-line upload-icon-large"></i>
                <h3>Drag & Drop images here</h3>
                <p class="text-sm text-muted">Supports JPEG, PNG, WEBP (Max size 5MB)</p>
                <button class="btn btn-secondary-outline mt-3">Browse Files</button>
            </div>
            <h3 class="card-title-sub mb-4">Gallery Images</h3>
            <div class="gallery-grid-layout">
                <!-- Add gallery items here -->
                <div class="gallery-item-card">
                    <div class="gallery-image-wrapper">
                        <div class="gallery-placeholder-img">Item 1</div>
                    </div>
                    <div class="gallery-item-footer">
                        <span class="gallery-filename">main_image.png</span>
                        <div class="gallery-item-actions">
                            <button class="btn-icon-sm"><i class="ri-delete-bin-line"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
            </div>
        </main>
    </div>
    
    <!-- Core JavaScript -->
    <script src="../assets/js/main.js"></script>
    
</body>
</html>
