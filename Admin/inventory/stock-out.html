<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Out - ApnaShop Admin</title>
    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Core Stylesheets -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/tables.css">
    <link rel="stylesheet" href="../assets/css/forms.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    
</head>
<body>
    <div id="app-container" class="dashboard-shell-layout">
        <!-- Sidebar and Header injected dynamically by main.js -->
        <main class="content-wrapper" id="content-container">
            <div class="page-header-section animate-fade-in">
                <div class="header-title-area">
                    <span class="breadcrumbs-label">Product Management / Stock Out</span>
                    <h1 class="page-title-text">Stock Out</h1>
                </div>
                <div class="header-actions-area">
                    
        <button class="btn btn-secondary-outline" onclick="window.history.back()">Cancel</button>
        <button class="btn btn-primary ml-2" id="save-form-btn">Save Changes</button>
        
                </div>
            </div>
            
            <div class="page-content-area animate-fade-in">
                
        <div class="grid-2-columns">
            <div class="card">
                <h3 class="card-title-sub">General Information</h3>
                <form class="admin-standard-form">
                    <div class="form-group-item">
                        <label class="form-label-text">Title / Name</label>
                        <input type="text" class="form-input-element" placeholder="Enter name" required>
                    </div>
                    <div class="form-group-item">
                        <label class="form-label-text">Description</label>
                        <textarea class="form-textarea-element" rows="5" placeholder="Enter detailed description"></textarea>
                    </div>
                </form>
            </div>
            <div class="card">
                <h3 class="card-title-sub">Additional Configuration</h3>
                <form class="admin-standard-form">
                    <div class="form-group-item">
                        <label class="form-label-text">Status</label>
                        <select class="form-select-element">
                            <option value="active">Active / Published</option>
                            <option value="draft">Draft / Hidden</option>
                            <option value="scheduled">Scheduled</option>
                        </select>
                    </div>
                    <div class="form-group-item">
                        <label class="form-label-text">Tags / Keywords</label>
                        <input type="text" class="form-input-element" placeholder="Comma separated, e.g. summer, offer, sale">
                    </div>
                    <div class="form-group-item mt-4">
                        <label class="form-toggle-switch-label">
                            <input type="checkbox" class="form-toggle-checkbox-input" checked>
                            <span class="form-toggle-slider-pill"></span>
                            <span class="form-toggle-text-span">Show on Front-end Store</span>
                        </label>
                    </div>
                </form>
            </div>
        </div>
        
            </div>
        </main>
    </div>
    
    <!-- Core JavaScript -->
    <script src="../assets/js/main.js"></script>
    
</body>
</html>
