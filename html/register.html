<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApNASHOp - Register Account</title>
    <link rel="stylesheet" href="../css/style.css?v=2.0">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, var(--navy-blue), var(--navy-light));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-container {
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            position: relative;
            overflow: hidden;
        }
        .auth-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .auth-header .logo-text {
            font-size: 28px;
            font-weight: 800;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 10px;
        }
        .auth-header .logo-text .apna { color: var(--navy-blue); }
        .auth-header .logo-text .shop { color: var(--orange-primary); }
        .auth-header p {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
        }
        .auth-btn {
            width: 100%;
            height: 48px;
            background: var(--orange-primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(255, 140, 0, 0.2);
            transition: var(--transition);
            margin-top: 15px;
        }
        .auth-btn:hover {
            background: var(--orange-hover);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="auth-header">
        <a href="index.html" class="logo-text">
            <span class="apna">ApNA</span><span class="shop">sHOp</span>
        </a>
        <p>Register a new account to unlock member privileges</p>
    </div>

    <!-- Sign Up Form matching script.js selector -->
    <form id="signUpForm">
        <div class="auth-field-group">
            <label for="regName">Name</label>
            <input type="text" id="regName" required placeholder="John Doe">
        </div>
        
        <div class="auth-field-group">
            <label for="regEmail">Email Address</label>
            <input type="email" id="regEmail" required placeholder="yourname@gmail.com">
        </div>
        
        <div class="auth-field-group">
            <label for="regPhone">Contact Number</label>
            <input type="tel" id="regPhone" required placeholder="9876543210">
        </div>
        
        <div class="auth-field-group">
            <label for="regPassword">Password</label>
            <input type="password" id="regPassword" required placeholder="••••••••">
        </div>
        
        <div class="auth-field-group">
            <label>Signing As</label>
            <div class="auth-radio-group">
                <label class="auth-radio-label">
                    <input type="radio" name="regUserType" value="buyer" checked>
                    <span class="auth-custom-radio"></span>
                    Buyer
                </label>
                <label class="auth-radio-label">
                    <input type="radio" name="regUserType" value="supplier">
                    <span class="auth-custom-radio"></span>
                    Supplier
                </label>
            </div>
        </div>
        
        <button type="submit" class="auth-btn">SIGN UP</button>
        
        <p class="auth-switch-text" style="text-align: center; margin-top: 25px; font-size: 13px; color: var(--text-muted);">
            Already have an account? <a href="login.html" style="color: var(--orange-primary); font-weight: 700; text-decoration: none;">Login</a>
        </p>
    </form>
</div>

<!-- Scripts -->
<script src="../js/products.js" defer></script>
<script src="../js/cart.js?v=2.0" defer></script>
<script src="../js/script.js?v=2.0" defer></script>
</body>
</html>
